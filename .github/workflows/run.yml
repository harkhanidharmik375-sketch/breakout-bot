name: Masterpiece Live Runner

on:
  schedule:
    # 03:45 UTC = 09:15 AM IST (Market Opening)
    - cron: '45 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-live-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run 5-Hour Continuous Live Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
